<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Cyber Security Challenge</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --safe-color: #22c55e;
      --threat-color: #ef4444;
      --accent-color: #f97316;
      --text-color: #f8fafc;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 20px;
      overflow: hidden;
    }

    header {
      text-align: center;
      margin-top: 10px;
    }

    h1 {
      font-size: 2.5rem;
      color: var(--accent-color);
      text-transform: uppercase;
      letter-spacing: 2px;
      text-shadow: 0 0 10px rgba(249, 115, 22, 0.4);
    }

    .scoreboard {
      display: flex;
      gap: 40px;
      font-size: 1.5rem;
      margin-top: 15px;
      background: rgba(255, 255, 255, 0.05);
      padding: 10px 30px;
      border-radius: 30px;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .lives span {
      font-size: 1.8rem;
    }

    .game-area {
      position: relative;
      width: 100%;
      max-width: 500px;
      height: 480px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .card {
      position: absolute;
      width: 100%;
      height: 100%;
      background: var(--card-bg);
      border-radius: 24px;
      padding: 30px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
      border: 2px solid rgba(255, 255, 255, 0.1);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      cursor: grab;
      transition: transform 0.1s ease, box-shadow 0.2s ease;
      touch-action: none;
    }

    .card:active {
      cursor: grabbing;
    }

    .badge {
      align-self: flex-start;
      padding: 8px 16px;
      border-radius: 20px;
      font-weight: bold;
      font-size: 0.9rem;
      text-transform: uppercase;
      background: #334155;
      color: #94a3b8;
    }

    .prompt-box {
      background: #0f172a;
      border-radius: 16px;
      padding: 20px;
      border: 1px solid #334155;
      margin: 20px 0;
      flex-grow: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      font-size: 1.25rem;
      line-height: 1.5;
    }

    .team-tag {
      font-weight: 600;
      color: var(--accent-color);
      font-size: 1.1rem;
      text-align: center;
    }

    .swipe-overlay {
      position: absolute;
      top: 30px;
      font-size: 2rem;
      font-weight: 900;
      padding: 10px 20px;
      border-radius: 12px;
      border: 4px solid;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.1s ease;
    }

    .overlay-safe {
      right: 30px;
      color: var(--safe-color);
      border-color: var(--safe-color);
      transform: rotate(15deg);
    }

    .overlay-threat {
      left: 30px;
      color: var(--threat-color);
      border-color: var(--threat-color);
      transform: rotate(-15deg);
    }

    .controls {
      display: flex;
      gap: 20px;
      width: 100%;
      max-width: 500px;
      margin-bottom: 20px;
    }

    .btn {
      flex: 1;
      padding: 18px;
      border: none;
      border-radius: 16px;
      font-size: 1.2rem;
      font-weight: bold;
      color: white;
      cursor: pointer;
      transition: transform 0.1s ease, filter 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    .btn:active {
      transform: scale(0.96);
    }

    .btn-threat {
      background: var(--threat-color);
      box-shadow: 0 8px 20px rgba(239, 68, 68, 0.3);
    }

    .btn-safe {
      background: var(--safe-color);
      box-shadow: 0 8px 20px rgba(34, 197, 94, 0.3);
    }

    .modal {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.85);
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
      z-index: 100;
    }

    .modal.active {
      opacity: 1;
      pointer-events: auto;
    }

    .modal-content {
      background: var(--card-bg);
      padding: 40px;
      border-radius: 24px;
      text-align: center;
      max-width: 400px;
      width: 90%;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .modal h2 {
      font-size: 2rem;
      margin-bottom: 15px;
    }

    .restart-btn {
      margin-top: 25px;
      padding: 15px 30px;
      background: var(--accent-color);
      border: none;
      border-radius: 12px;
      color: white;
      font-size: 1.1rem;
      font-weight: bold;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <header>
    <h1>Cyber Safe or Threat? 🏀</h1>
    <div class="scoreboard">
      <div>Score: <span id="score">0</span></div>
      <div class="lives">Chances: <span id="lives">🏀🏀🏀</span></div>
    </div>
  </header>

  <div class="game-area">
    <div class="card" id="card">
      <div class="swipe-overlay overlay-threat">THREAT ✖</div>
      <div class="swipe-overlay overlay-safe">SAFE ✔</div>
      <div class="badge">Public AI Prompt</div>
      <div class="prompt-box" id="prompt-text">Loading scenario...</div>
      <div class="team-tag" id="team-text">Team</div>
    </div>
  </div>

  <div class="controls">
    <button class="btn btn-threat" onclick="handleSwipe(false)">👈 SWIPE LEFT<br>(Cyber Threat)</button>
    <button class="btn btn-safe" onclick="handleSwipe(true)">SWIPE RIGHT 👉<br>(Cyber Safe)</button>
  </div>

  <div class="modal" id="game-over-modal">
    <div class="modal-content">
      <h2>Game Over!</h2>
      <p>Final Score: <span id="final-score">0</span></p>
      <button class="restart-btn" onclick="resetGame()">Play Again</button>
    </div>
  </div>

  <script>
    // Scenarios configured from prompt workplace scenarios
    const scenarios = [
      {
        team: "HR Team",
        prompt: "Draft a job description for a full stack software engineering role.",
        isSafe: true // Safe scenario
      },
      {
        team: "Procurement Team",
        prompt: "Compare the vendor pricing breakdown and summarize recommendations for a fashion show venue.",
        isSafe: false // Threat scenario (Confidential financial/pricing data)
      },
      {
        team: "Marketing Team",
        prompt: "Generate a Christmas greeting post design for a corporate Instagram page. It needs to look professional for posting directly on Instagram!",
        isSafe: false // Threat scenario (Direct unvetted media generation)
      },
      {
        team: "Legal Team",
        prompt: "Summarize and compare the Singapore and South Korea data privacy regulations and format it in a comparative study report format.",
        isSafe: true // Safe scenario (Publicly available legal information)
      },
      {
        team: "HR Team",
        prompt: "Compare the 2 CVs and analyze which candidate would be the best fit for XYZ role.",
        isSafe: false // Threat scenario (Personally Identifiable Information / Candidate PII)
      },
      {
        team: "Chanel.com Development Team",
        prompt: "Check bugs or logic flaws in below web application code:\n\ndocument.querySelector('.remove-btn').addEventListener('click', function() { alert('Chanel.com_Item removed'); });",
        isSafe: false // Threat scenario (Proprietary brand code submission)
      }
    ];

    let currentIdx = 0;
    let score = 0;
    let lives = 3;
    let startX = 0;
    let currentX = 0;
    let isDragging = false;

    const card = document.getElementById('card');
    const promptText = document.getElementById('prompt-text');
    const teamText = document.getElementById('team-text');
    const scoreEl = document.getElementById('score');
    const livesEl = document.getElementById('lives');
    const overlaySafe = card.querySelector('.overlay-safe');
    const overlayThreat = card.querySelector('.overlay-threat');
    const gameOverModal = document.getElementById('game-over-modal');

    function updateCard() {
      if (currentIdx >= scenarios.length) {
        currentIdx = 0; // Loop scenarios or end game
      }
      const data = scenarios[currentIdx];
      promptText.innerText = `"${data.prompt}"`;
      teamText.innerText = `— ${data.team}`;
      card.style.transform = 'translate(0px, 0px) rotate(0deg)';
      overlaySafe.style.opacity = '0';
      overlayThreat.style.opacity = '0';
    }

    function processAnswer(userSaysSafe) {
      const correct = scenarios[currentIdx].isSafe === userSaysSafe;
      if (correct) {
        score += 100;
        scoreEl.innerText = score;
      } else {
        lives -= 1;
        livesEl.innerText = '🏀'.repeat(Math.max(0, lives));
        if (lives <= 0) {
          endGame();
          return;
        }
      }
      currentIdx++;
      updateCard();
    }

    function handleSwipe(isSafe) {
      const flyOutX = isSafe ? 1000 : -1000;
      card.style.transition = 'transform 0.4s ease';
      card.style.transform = `translate(${flyOutX}px, 0px) rotate(${isSafe ? 30 : -30}deg)`;
      setTimeout(() => {
        card.style.transition = 'none';
        processAnswer(isSafe);
      }, 300);
    }

    // Touch & Mouse Drag Handlers
    function startDrag(e) {
      isDragging = true;
      startX = e.type.includes('touch') ? e.touches[0].clientX : e.clientX;
      card.style.transition = 'none';
    }

    function moveDrag(e) {
      if (!isDragging) return;
      currentX = e.type.includes('touch') ? e.touches[0].clientX : e.clientX;
      const diffX = currentX - startX;
      const rotate = diffX * 0.05;
      card.style.transform = `translate(${diffX}px, 0px) rotate(${rotate}deg)`;

      if (diffX > 50) {
        overlaySafe.style.opacity = Math.min((diffX - 50) / 100, 1);
        overlayThreat.style.opacity = '0';
      } else if (diffX < -50) {
        overlayThreat.style.opacity = Math.min((-diffX - 50) / 100, 1);
        overlaySafe.style.opacity = '0';
      } else {
        overlaySafe.style.opacity = '0';
        overlayThreat.style.opacity = '0';
      }
    }

    function endDrag() {
      if (!isDragging) return;
      isDragging = false;
      const diffX = currentX - startX;
      if (diffX > 120) {
        handleSwipe(true);
      } else if (diffX < -120) {
        handleSwipe(false);
      } else {
        card.style.transition = 'transform 0.2s ease';
        card.style.transform = 'translate(0px, 0px) rotate(0deg)';
        overlaySafe.style.opacity = '0';
        overlayThreat.style.opacity = '0';
      }
    }

    // Event Listeners
    card.addEventListener('mousedown', startDrag);
    document.addEventListener('mousemove', moveDrag);
    document.addEventListener('mouseup', endDrag);

    card.addEventListener('touchstart', startDrag);
    document.addEventListener('touchmove', moveDrag);
    document.addEventListener('touchend', endDrag);

    // Keyboard controls support
    document.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowLeft') handleSwipe(false);
      if (e.key === 'ArrowRight') handleSwipe(true);
    });

    function endGame() {
      document.getElementById('final-score').innerText = score;
      gameOverModal.classList.add('active');
    }

    function resetGame() {
      score = 0;
      lives = 3;
      currentIdx = 0;
      scoreEl.innerText = score;
      livesEl.innerText = '🏀🏀🏀';
      gameOverModal.classList.remove('active');
      updateCard();
    }

    updateCard();
  </script>
</body>
</html>
